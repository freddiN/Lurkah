name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # Löst einen Release-Build aus, wenn du einen Tag beginnend mit 'v' pushst (z.B. v1.0.0)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Wichtig: Erforderlich, damit die GitHub Action ein Release erstellen darf
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/lurkah.apk

      # 1. Immer als Artifact hochladen (für jeden normalen Push auf main/master)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lurkah-App-APK
          path: app/build/outputs/apk/release/lurkah.apk

      # 2. AUTOMATISCHES RELEASE ERSTELLEN (Nur wenn ein Tag gepusht wurde, z.B. v1.0.0)
      - name: Create GitHub Release & Upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Schreibt automatisch die Release-Notes aus den Commit-Titel
          files: app/build/outputs/apk/release/lurkah.apk