name: Build Feature Branch

on:
  push:
    branches-ignore: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Decode Keystore
        if: github.actor != 'dependabot[bot]'
        run: |
          echo -n "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build Signed Release APK
        if: github.actor != 'dependabot[bot]'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache

      - name: Upload APK Artifact
        if: github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: Lurkah-App-APK-Release
          path: |
            app/build/outputs/apk/release/*universal*.apk
          retention-days: 1
          if-no-files-found: error

      - name: Build Debug APK (Dependabot)
        if: github.actor == 'dependabot[bot]'
        run: ./gradlew assembleDebug --build-cache