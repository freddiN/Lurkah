name: Build Android APK

on:
  push:
    branches: [ "main", "master", "test" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # Befehl auf Release geändert
      - name: Build Release APK
        run: gradle assembleRelease

      # Pfad auf Release geändert
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/lurkah.apk

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-release-key.jks

      - name: Sign APK
        run: |
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore my-release-key.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
              -keypass ${{ secrets.KEY_PASSWORD }} \
              app/build/outputs/apk/release/lurkah.apk ${{ secrets.KEY_ALIAS }}

      - name: Verify signature
        run: jarsigner -verify -verbose -certs app/build/outputs/apk/release/lurkah.apk

      # Pfad auf Release geändert
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lurkah-App-APK
          path: app/build/outputs/apk/release/lurkah.apk
